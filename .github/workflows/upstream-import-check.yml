name: VzGramm upstream integration

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 1"

permissions:
  contents: write

jobs:
  integration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VzGramm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream Telegram Android
        run: bash ./scripts/bootstrap-upstream.sh

      - name: Apply VzGramm branding layer
        run: bash ./scripts/apply-vzgramm-branding.sh

      - name: Verify VzGramm identity
        run: bash ./scripts/verify-vzgramm-branding.sh

      - name: Preserve VzGramm development signing key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VzGramm-signing-key
          path: TMessagesProj/config/release.keystore
          retention-days: 90

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Compile VzGramm Android app
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace

      - name: Upload debug build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vzgramm-build
          path: |
            TMessagesProj_App/build/outputs/**/*.apk
            TMessagesProj_App/build/outputs/**/*.aab
          if-no-files-found: ignore

      - name: Persist imported upstream source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to persist."
            exit 0
          fi
          git commit -m "Sync Telegram Android upstream into VzGramm"
          git push origin HEAD:main
