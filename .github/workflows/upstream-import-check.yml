name: VzGramm Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vzgramm-android-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  integration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VzGramm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream Telegram Android
        run: bash ./scripts/bootstrap-upstream.sh

      - name: Apply VzGramm branding
        run: bash ./scripts/apply-vzgramm-branding.sh

      - name: Normalize localized VzGramm names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("TMessagesProj/src/main/res")
          for p in root.rglob("strings*.xml"):
              s=p.read_text(encoding="utf-8")
              s=re.sub(r'(<string name="AppName">)[^<]*(</string>)', r'\1VzGramm\2', s)
              s=re.sub(r'(<string name="AppNameBeta">)[^<]*(</string>)', r'\1VzGramm Beta\2', s)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Apply VzGramm feature layer
        run: bash ./scripts/apply-vzgramm-features.sh

      - name: Verify VzGramm
        run: bash ./scripts/verify-vzgramm-branding.sh

      - name: Set VzGramm version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path("gradle.properties")
          s=p.read_text()
          n=int(os.environ["GITHUB_RUN_NUMBER"])+10000
          s=re.sub(r"^APP_VERSION_CODE=.*$",f"APP_VERSION_CODE={n}",s,flags=re.M)
          s=re.sub(r"^APP_VERSION_NAME=.*$",f"APP_VERSION_NAME=1.0.{n-10000}",s,flags=re.M)
          p.write_text(s)
          PY

      - name: Restore VzGramm signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./scripts/restore-signing-key.sh

      - name: Preserve VzGramm signing key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VzGramm-signing-key
          path: TMessagesProj/config/release.keystore
          retention-days: 90
          if-no-files-found: error

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Build fast VzGramm alpha APK
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 8
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --build-cache --parallel --stacktrace

      - name: Upload VzGramm APK
        uses: actions/upload-artifact@v4
        with:
          name: VzGramm-apk
          path: TMessagesProj_App/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find TMessagesProj_App/build/outputs -type f -name '*.apk' | head -n 1)"
          gh release create "v1.0.$GITHUB_RUN_NUMBER" "$APK#VzGramm.apk"             --repo "$GITHUB_REPOSITORY"             --title "VzGramm v1.0.$GITHUB_RUN_NUMBER"             --generate-notes             --latest

      - name: Persist imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync VzGramm Android source"
          git push origin HEAD:main
